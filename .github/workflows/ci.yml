name: Rust
on: [push, pull_request]
jobs:
  check:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - run: cargo fmt --all --check
      - run: cargo test --workspace
      - run: cargo clippy --workspace --all-targets -- -D warnings
  inbox-ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npx --yes agent-browser@0.39.4 install --with-deps
      - run: python3 -m unittest discover -s ui -p test_focus.py -v
      - uses: actions/checkout@v4
        with:
          repository: stablyai/orca
          ref: 1d1c6da582e1bf76c188ff44e5f11ca05fb350e4
          path: .orca-reference
      - uses: pnpm/action-setup@v4
        with:
          version: 12.14.0
      - run: pnpm --dir .orca-reference install --frozen-lockfile --ignore-scripts
      - run: python3 -m unittest discover -s ui -p test_sidebar.py -v
        env:
          ORCA_REFERENCE_ROOT: ${{ github.workspace }}/.orca-reference
      - run: python3 ui/test_ui.py
        env:
          ORCA_REFERENCE_ROOT: ${{ github.workspace }}/.orca-reference
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: inbox-ui-screenshots
          path: artifacts/inbox-ui/*.png
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: status-bar-comparison
          path: /tmp/orquesta-ui-shots/
