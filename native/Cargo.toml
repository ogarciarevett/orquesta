[package]
name = "orquesta-desktop"
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace]

[features]
custom-protocol = ["tauri/custom-protocol"]
native-smoke = []

[build-dependencies]
tauri-build = "=2.7.4"

[dependencies]
tauri = "=2.12.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
orquesta-orchestration = { path = "../crates/orquesta-orchestration" }
